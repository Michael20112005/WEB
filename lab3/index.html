<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Mobs</title>
    <link rel="stylesheet" href="custom.css" />
  </head>

  <body>
    <div class="header">
      <div class="header_container">
        <div class="left-side">
          <h1 class="title">Моби</h1>
          <ul id="nav">
            <li><a href="#">Наявні Моби</a></li>
            <li><a href="#">Створити Моба</a></li>
          </ul>
        </div>
        <div class="right-side">
          <input type="search" id="find_input" placeholder="Пошук..." />
          <button id="find_button" type="submit" class="btn">Пошук</button>
          <button id="cancel_button" type="reset" class="btn">Стерти</button>
        </div>
      </div>
    </div>

    <div class="main_part">
      <div class="container">
        <div class="grid">
          <div class="Side__managing">
            <h2 class="title">Фільтр та загальні дані</h2>
            <div class="sorting-container">
              <label for="sort_select" class="sorting-label"
                >Сортувати за:</label
              >
              <select id="sort_select" class="sort-select">
                <option value="default">За замовчуванням</option>
                <option value="name">Ім'я</option>
                <option value="life">Життя</option>
                <option value="strength">Сила</option>
              </select>
            </div>
            <p class="summary-text">
              Загальна кількість життя: <span id="total_life">0</span>
            </p>
            <p class="summary-text">
              Загальна сила: <span id="total_strength">0</span>
            </p>
          </div>
          <ul id="mob_container" class="card-container"></ul>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
